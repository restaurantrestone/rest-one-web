<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rest One</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e8e2d8;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:16px 0 32px}

.w{
  font-family:Arial,sans-serif;
  background:#faf8f4;
  color:#1a1612;
  width:100%;
  max-width:390px;
  border-radius:20px;
  overflow:hidden;
  border:1px solid #e8e2d8;
  box-shadow:0 4px 24px rgba(0,0,0,.1);
}

/* HERO */
.hero{padding:40px 24px 36px;text-align:center;background:#faf8f4;position:relative}
.hero::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:40px;height:2px;background:#d4a843;border-radius:2px}

.tag{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#d4a843;font-weight:700;display:block;margin-bottom:14px}
.rname{font-family:Georgia,serif;font-size:40px;font-weight:700;color:#1a1612;line-height:1.05;margin-bottom:0}
.rname em{font-style:italic;color:#d4a843}
.rdesc{font-size:13px;color:#7a7060;line-height:1.7;margin:16px 0 20px}
.hours{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#1a1612;background:#f0ece3;padding:7px 16px;border-radius:30px;margin-bottom:28px}
.dot{width:7px;height:7px;background:#5aaa72;border-radius:50%;flex-shrink:0}

/* CONTACT BUTTONS */
.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 10px;border-radius:14px;
  font-family:Arial,sans-serif;font-size:13px;font-weight:600;
  cursor:pointer;background:transparent;transition:opacity .15s;
  min-height:48px;text-decoration:none;border:none;
}
.btn:hover{opacity:.75}
.btn-ig{color:#c2440c;border:1.5px solid #c2440c}
.btn-tg{color:#1a7fc4;border:1.5px solid #1a7fc4}
.btn-ph{color:#1a1612;border:1.5px solid #c8b99a}
.btn-map{color:#6a5de0;border:1.5px solid #6a5de0}
.btn-full{grid-column:1/-1}

/* MENU TOGGLE */
.mw{padding:24px 24px 0}
.btn-open{
  width:100%;padding:16px;background:#1a1612;color:#faf8f4;
  border:none;border-radius:16px;
  font-family:Arial,sans-serif;font-size:15px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
  min-height:52px;transition:background .15s;
}
.btn-open:active,.btn-open:hover{background:#d4a843;color:#1a1612}
.arr{display:inline-block;transition:transform .25s;font-style:normal}
.btn-open.open .arr{transform:rotate(180deg)}

/* MENU SECTION */
.ms{overflow:hidden;max-height:0;transition:max-height .5s cubic-bezier(.4,0,.2,1)}
.ms.on{max-height:9999px}
.mi{padding:28px 20px 36px}

.mh{font-family:Georgia,serif;font-size:26px;font-weight:700;color:#1a1612;margin-bottom:18px}
.mh em{font-style:italic;color:#d4a843}

/* CATEGORY TABS */
.cats{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:22px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.cat{
  padding:8px 18px;border-radius:30px;font-size:13px;font-weight:600;
  cursor:pointer;white-space:nowrap;border:1.5px solid #e0d8cc;
  color:#7a7060;background:transparent;
  font-family:Arial,sans-serif;min-height:38px;flex-shrink:0;transition:all .15s;
}
.cat.on{background:#1a1612;color:#faf8f4;border-color:#1a1612}

/* CARDS */
.grid{display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:1px solid #ede8df;border-radius:16px;overflow:hidden;display:flex;flex-direction:row;min-height:96px}
.cimg{width:96px;min-width:96px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;background:#f5f2ec}
.cimg img{width:100%;height:100%;object-fit:cover}
.cimg-ph{font-size:38px}
.cb{padding:14px;flex:1;display:flex;flex-direction:column;justify-content:space-between}
.cn{font-size:15px;font-weight:700;color:#1a1612;margin-bottom:4px}
.cd{font-size:12px;color:#a09585;line-height:1.5;flex:1}
.cf{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.cp{font-family:Georgia,serif;font-size:17px;font-weight:700;color:#1a1612}
.cbadge{font-size:10px;color:#a07810;background:#fdf5e0;padding:3px 8px;border-radius:20px;font-weight:700}

.foot{padding:16px 24px;border-top:1px solid #ede8df;text-align:center;font-size:12px;color:#b0a898}

/* LOADING */
.loading{padding:40px;text-align:center;color:#7a7060;font-size:14px}
</style>
</head>
<body>
<div class="w" id="app">
  <div class="loading">Загрузка...</div>
</div>

<script>
const MENU_URL = 'rest-one/menu.json';

let allCategories = [];
let activeCat = 'all';

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderCards(catName) {
  let items = [];
  if (catName === 'all') {
    allCategories.forEach(c => { if (c.items) items = items.concat(c.items.filter(i => !i.hidden && i.available !== false)); });
  } else {
    const cat = allCategories.find(c => c.name === catName);
    if (cat && cat.items) items = cat.items.filter(i => !i.hidden && i.available !== false);
  }
  return items.map(item => {
    const price = item.variants && item.variants.length
      ? 'от ' + Math.min(...item.variants.map(v => v.price)).toLocaleString('ru-RU')
      : (item.price ? Number(item.price).toLocaleString('ru-RU') : '');
    const badge = item.badges && item.badges[0] ? `<span class="cbadge">${esc(item.badges[0])}</span>` : '';
    const imgEl = item.image
      ? `<img src="${esc(item.image)}" alt="${esc(item.title)}" loading="lazy">`
      : `<span class="cimg-ph">🍽</span>`;
    return `<div class="card">
      <div class="cimg">${imgEl}</div>
      <div class="cb">
        <div>
          <p class="cn">${esc(item.title)}</p>
          <p class="cd">${esc(item.description || '')}</p>
        </div>
        <div class="cf">
          <span class="cp">${esc(price)} сум</span>
          ${badge}
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderCatTabs() {
  const tabs = [`<button class="cat on" onclick="fc(this,'all')">Все</button>`];
  allCategories.forEach(c => {
    tabs.push(`<button class="cat" onclick="fc(this,${JSON.stringify(c.name)})">${esc(c.name)}</button>`);
  });
  return tabs.join('');
}

function fc(btn, cat) {
  document.querySelectorAll('.cat').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  activeCat = cat;
  document.getElementById('grid').innerHTML = renderCards(cat);
}

function toggle() {
  const ms = document.getElementById('ms');
  const mb = document.getElementById('mb');
  const mbt = document.getElementById('mbt');
  const open = ms.classList.toggle('on');
  mb.classList.toggle('open');
  mbt.textContent = open ? 'Скрыть меню' : 'Посмотреть меню';
}

function buildApp(data) {
  const r = data.restaurant || {};
  allCategories = (data.categories || []).filter(c => !c.hidden);

  const name = r.name || 'Rest One';
  const nameParts = name.split(' ');
  const nameHtml = nameParts.length > 1
    ? `${esc(nameParts[0])} <em>${esc(nameParts.slice(1).join(' '))}</em>`
    : esc(name);

  const desc = r.description || '';
  const hours = r.hours || '';
  const phone = r.phone || '';
  const address = r.address || '';
  const instagram = r.instagram || '';
  const telegram = r.telegram || '';
  const year = new Date().getFullYear();

  const btns = [];
  if (instagram) btns.push(`<a class="btn btn-ig" href="${esc(instagram)}" target="_blank" rel="noopener">◈ Instagram</a>`);
  if (telegram) btns.push(`<a class="btn btn-tg" href="${esc(telegram)}" target="_blank" rel="noopener">✈ Telegram</a>`);
  if (phone) btns.push(`<a class="btn btn-ph btn-full" href="tel:${esc(phone.replace(/\s/g,''))}">${esc(phone)}</a>`);
  if (address) btns.push(`<button class="btn btn-map btn-full" onclick="navigator.clipboard&&navigator.clipboard.writeText(${JSON.stringify(address)})"">◎ ${esc(address)}</button>`);

  document.getElementById('app').innerHTML = `
    <div class="hero">
      <span class="tag">Ресторан</span>
      <h1 class="rname">${nameHtml}</h1>
      ${desc ? `<p class="rdesc">${esc(desc)}</p>` : ''}
      ${hours ? `<div class="hours"><span class="dot"></span> Открыто · ${esc(hours)}</div>` : ''}
      ${btns.length ? `<div class="btns">${btns.join('')}</div>` : ''}
    </div>

    <div class="mw">
      <button class="btn-open" id="mb" onclick="toggle()">
        <span id="mbt">Посмотреть меню</span>
        <em class="arr">↓</em>
      </button>
    </div>

    <div class="ms" id="ms">
      <div class="mi">
        <h2 class="mh">Наше <em>меню</em></h2>
        <div class="cats">${renderCatTabs()}</div>
        <div class="grid" id="grid">${renderCards('all')}</div>
      </div>
    </div>

    <div class="foot">© ${year} ${esc(name)}</div>
  `;
}

fetch(MENU_URL)
  .then(r => r.json())
  .then(buildApp)
  .catch(() => {
    document.getElementById('app').innerHTML = '<div class="loading">Не удалось загрузить меню</div>';
  });
</script>
</body>
</html>
