<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rest One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@400;500;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#FAF6EE;
  --dark:#1A1A1A;
  --gold:#C9A961;
  --green:#1F3A2E;
  --muted:#6B6B6B;
  --card:#FFFFFF;
  --border:#EDE8DF;
}
html{scroll-behavior:smooth}
body{background:#DDD8CE;font-family:'Inter',sans-serif;color:var(--dark)}

/* ─── STICKY LANG BAR ─── */
.lang-bar{
  position:sticky;top:0;z-index:200;
  display:flex;justify-content:flex-end;align-items:center;
  padding:8px 16px;
  background:rgba(250,246,238,0.96);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(201,169,97,0.18);
}
.lang-btns{display:flex;gap:5px}
.lang-btn{
  padding:5px 11px;border-radius:20px;
  border:1.5px solid var(--border);
  background:transparent;color:var(--muted);
  font-family:'Inter',sans-serif;font-size:11px;font-weight:600;
  cursor:pointer;letter-spacing:.3px;transition:all .15s;
}
.lang-btn.active{background:var(--gold);border-color:var(--gold);color:#fff}

/* ─── PAGE WRAPPER ─── */
.page{max-width:480px;margin:0 auto;background:var(--cream);min-height:100vh}

/* ─── HERO ─── */
.hero-section{padding:32px 20px 0}
.hero-inner{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.hero-eyebrow{
  font-size:10px;letter-spacing:3px;text-transform:uppercase;
  color:var(--gold);font-weight:700;display:block;margin-bottom:10px;
}
.hero-title{
  font-family:'Playfair Display',serif;font-size:36px;font-weight:700;
  color:var(--dark);line-height:1.05;margin-bottom:12px;
}
.hero-tagline{
  font-family:'Caveat',cursive;font-size:19px;color:var(--gold);
  margin-bottom:18px;line-height:1.3;
}
.hero-features{display:flex;flex-direction:column;gap:11px;margin-bottom:18px}
.hf{display:flex;align-items:center;gap:9px}
.hf-ico{
  width:30px;height:30px;background:rgba(201,169,97,.12);border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.hf-ico svg{width:15px;height:15px;stroke:var(--gold);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hf-title{font-size:12px;font-weight:600;color:var(--dark);line-height:1.2}
.hf-sub{font-size:10px;color:var(--muted);line-height:1.3;margin-top:1px}
.status-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 13px;border-radius:30px;
  background:rgba(201,169,97,.1);border:1px solid rgba(201,169,97,.3);
  font-size:11px;color:var(--dark);font-weight:500;
}
.s-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.s-dot.open{background:#4CAF50}
.s-dot.closed{background:var(--muted)}

/* hero right */
.hero-right{position:relative}
.hero-img-wrap{
  border-radius:20px;overflow:hidden;aspect-ratio:3/4;
  background:#D5CEBD;position:relative;
}
.hero-img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.hero-badge{
  position:absolute;top:10px;right:-8px;
  width:76px;height:76px;background:var(--gold);border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:5px;line-height:1.25;
  box-shadow:0 4px 14px rgba(201,169,97,.45);
}
.hero-badge span{font-size:8.5px;font-weight:700;color:#1A1A1A;text-transform:uppercase;letter-spacing:.2px}
.hero-badge .bb{font-size:9.5px;font-weight:900}
.hero-sticker{
  position:absolute;bottom:10px;left:-8px;right:-8px;
  background:var(--dark);color:var(--gold);
  padding:7px 10px;border-radius:10px;
  font-family:'Caveat',cursive;font-size:13px;text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}

/* ─── STATS BAR ─── */
.stats-bar{
  background:var(--green);margin:28px 0 0;
  padding:28px 20px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
}
.stat-cell{text-align:center;color:#fff}
.stat-icon{
  width:30px;height:30px;margin:0 auto 7px;
  background:rgba(255,255,255,.1);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.stat-icon svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.stat-value{
  font-family:'Playfair Display',serif;font-size:22px;font-weight:700;
  color:var(--gold);line-height:1;margin-bottom:4px;
}
.stat-stars{color:var(--gold);font-size:9px;margin-bottom:3px;letter-spacing:1px}
.stat-label{font-size:10px;color:rgba(255,255,255,.72);line-height:1.45;white-space:pre-line}

/* ─── CONTACTS ─── */
.contacts-section{padding:24px 20px;display:flex;flex-direction:column;gap:10px}
.contact-card{
  display:flex;align-items:center;gap:13px;
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:13px 15px;
  text-decoration:none;color:var(--dark);transition:opacity .15s;
}
.contact-card:hover{opacity:.8}
.cc-icon{
  width:40px;height:40px;background:rgba(201,169,97,.12);border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.cc-icon svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cc-text{flex:1;min-width:0}
.cc-label{font-size:11px;color:var(--muted);margin-bottom:2px}
.cc-value{font-size:13px;font-weight:600;color:var(--dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-arrow{color:var(--muted);font-size:15px;flex-shrink:0}

/* ─── BOOKING CTA ─── */
.booking-section{padding:0 20px 24px}
.booking-btn{
  display:block;width:100%;background:var(--gold);color:#fff;
  border:none;border-radius:22px;padding:18px 20px;
  text-align:center;text-decoration:none;cursor:pointer;transition:opacity .15s;
}
.booking-btn:hover{opacity:.88}
.booking-title{
  font-family:'Playfair Display',serif;font-size:19px;font-weight:700;
  display:block;margin-bottom:4px;
}
.booking-sub{font-size:12px;color:rgba(255,255,255,.82);display:block}

/* ─── GALLERY ─── */
.gallery-section{padding:0 20px 24px}
.section-title{
  font-family:'Playfair Display',serif;font-size:21px;font-weight:700;
  color:var(--dark);margin-bottom:14px;
}
.section-title em{font-style:italic;color:var(--gold)}
.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gallery-item{
  border-radius:14px;overflow:hidden;aspect-ratio:1;background:#D5CEBD;
}
.gallery-item img{width:100%;height:100%;object-fit:cover;display:block}

/* ─── FEATURES BOTTOM ─── */
.features-bottom{padding:0 20px 28px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.feat-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:15px;
}
.feat-icon{
  width:34px;height:34px;background:rgba(201,169,97,.12);border-radius:50%;
  display:flex;align-items:center;justify-content:center;margin-bottom:9px;
}
.feat-icon svg{width:17px;height:17px;stroke:var(--gold);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.feat-title{font-size:12px;font-weight:600;color:var(--dark);line-height:1.3;margin-bottom:3px}
.feat-sub{font-size:11px;color:var(--muted)}

/* ─── MENU CTA DIVIDER ─── */
.menu-cta-section{padding:0 20px 28px;text-align:center}
.divider{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.divider-text{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;white-space:nowrap}
.show-menu-btn{
  display:inline-block;background:var(--gold);color:#fff;
  border:none;border-radius:30px;padding:14px 40px;
  font-family:'Playfair Display',serif;font-size:16px;font-weight:700;
  cursor:pointer;text-decoration:none;transition:opacity .15s;
}
.show-menu-btn:hover{opacity:.88}

/* ─── MENU SECTION ─── */
#menu{background:var(--cream);padding:0 20px 40px}
.menu-section-title{
  font-family:'Playfair Display',serif;font-size:24px;font-weight:700;
  color:var(--dark);padding:28px 0 18px;
}
.menu-section-title em{font-style:italic;color:var(--gold)}
.cats{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:22px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.cat{
  padding:8px 17px;border-radius:30px;font-size:13px;font-weight:600;
  cursor:pointer;white-space:nowrap;border:1.5px solid var(--border);
  color:var(--muted);background:transparent;
  font-family:'Inter',sans-serif;min-height:38px;flex-shrink:0;transition:all .15s;
}
.cat.on{background:var(--dark);color:#FAF8F4;border-color:var(--dark)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden}
.cimg{width:100%;height:130px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#F5F2EC}
.cimg img{width:100%;height:100%;object-fit:cover}
.cimg-ph{font-size:40px}
.cb{padding:11px;display:flex;flex-direction:column;gap:5px}
.cn{font-size:14px;font-weight:700;color:var(--dark)}
.cd{font-size:11px;color:#A09585;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cf{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.cp{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--dark)}
.cbadge{font-size:10px;color:#A07810;background:#FDF5E0;padding:3px 7px;border-radius:20px;font-weight:700}
.menu-loading{padding:40px;text-align:center;color:var(--muted);font-size:14px}
.menu-error{padding:32px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}

/* ─── FOOTER ─── */
.site-footer{
  background:var(--green);padding:32px 20px;text-align:center;
}
.footer-logo{
  width:48px;height:48px;background:var(--gold);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 12px;
  font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:#fff;
}
.footer-name{
  font-family:'Playfair Display',serif;font-size:20px;font-weight:700;
  color:#fff;margin-bottom:6px;
}
.footer-tagline{font-size:12px;color:rgba(255,255,255,.6);margin-bottom:20px;line-height:1.55}
.footer-socials{display:flex;justify-content:center;gap:14px}
.footer-social{
  width:40px;height:40px;background:rgba(255,255,255,.1);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  text-decoration:none;transition:background .15s;
}
.footer-social:hover{background:rgba(201,169,97,.3)}
.footer-social svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.footer-copy{margin-top:16px;font-size:11px;color:rgba(255,255,255,.35)}

/* ─── RESPONSIVE ─── */
@media(max-width:440px){
  .hero-inner{grid-template-columns:1fr}
  .hero-right{order:-1}
  .hero-img-wrap{aspect-ratio:16/9}
  .hero-badge{right:4px}
  .hero-sticker{left:0;right:0}
  .stats-bar{grid-template-columns:1fr;gap:18px}
  .stat-cell{display:flex;align-items:center;gap:14px;text-align:left}
  .stat-icon{margin:0;flex-shrink:0}
  .stat-value{margin-bottom:2px}
}
</style>
</head>

</div><!-- /landing -->

<!-- [C] MENU CTA DIVIDER -->
<div class="menu-cta-section">

</div>

<!-- [D] MENU SECTION -->
<section id="menu">

  <div class="cats" id="cats"></div>
  <div class="grid" id="grid">
    <div class="menu-loading" id="menuLoading" style="grid-column:1/-1">Yuklanmoqda...</div>
  </div>
</section>

<!-- [E] FOOTER -->
<footer class="site-footer">
  <div class="footer-logo">R</div>
  <div class="footer-name">Rest One</div>
  <div class="footer-tagline" id="l-footer-tagline"></div>
  <div class="footer-socials" id="l-footer-socials"></div>
  <div class="footer-copy" id="l-footer-copy"></div>
</footer>

</div><!-- /page -->

  closed_status:{ ru: "Закрыто", uz_lat: "Yopiq",  uz_cyr: "Ёпиқ"  },
  show_menu:    { ru: "Показать меню", uz_lat: "Menyuni ko'rsatish", uz_cyr: "Менюни кўрсатиш" },
  our_menu:     { ru: "Наше <em>меню</em>", uz_lat: "Bizning <em>menyumiz</em>", uz_cyr: "Бизнинг <em>менюмиз</em>" },
  all_cats:     { ru: "Все",  uz_lat: "Barchasi", uz_cyr: "Барчаси" },

// ─── MENU URL ────────────────────────────────────────────────────────────────
const MENU_URL = (function () {
  const tmpl = 'rest-one/menu.json';
  if (!tmpl.startsWith('{{')) return tmpl;
  const r = new URLSearchParams(location.search).get('r');
  return r ? r + '/menu.json' : 'menu.json';
})();

// ─── LANGUAGE ────────────────────────────────────────────────────────────────
let currentLang = localStorage.getItem('restone_lang') || 'uz_lat';

function lang(field) {
  return (field && (field[currentLang] || field.uz_lat)) || '';
}

function setLang(l) {
  currentLang = l;
  localStorage.setItem('restone_lang', l);
  renderLanding();
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === l);
  });
}

function initLangBar() {
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === currentLang);
  });
}

// ─── OPEN/CLOSED ─────────────────────────────────────────────────────────────
function isOpen(hours) {
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  const [oH, oM] = hours.open.split(':').map(Number);
  const [cH, cM] = hours.close.split(':').map(Number);
  return mins >= oH * 60 + oM && mins < cH * 60 + cM;
}

// ─── RENDER LANDING ───────────────────────────────────────────────────────────
function renderLanding() {
  const d = LANDING_DATA;
  const h = d.hours;
  const open = isOpen(h);
  const c = d.contacts;

  // eyebrow + title + tagline
  document.getElementById('l-eyebrow').textContent = lang(d.eyebrow);
  document.getElementById('l-title').textContent = d.name;
  document.getElementById('l-tagline').textContent = lang(d.tagline);

  // features top
  document.getElementById('l-features').innerHTML = d.features_top.map(f => `
    <div class="hf">
      <div class="hf-ico">${icon(f.icon)}</div>
      <div>
        <div class="hf-title">${esc(lang(f.title))}</div>
        <div class="hf-sub">${esc(lang(f.subtitle))}</div>
      </div>
    </div>`).join('');

  // status pill
  const dotEl = document.getElementById('l-dot');
  dotEl.className = 's-dot ' + (open ? 'open' : 'closed');
  const statusLabel = open ? lang(I18N.open_status) : lang(I18N.closed_status);
  const timeInfo = open
    ? `${h.open} – ${h.close}`
    : `${lang(I18N.open_status).replace('Открыто','открывается').replace('Ochiq','ochiladi').replace('Очиқ','очилади')} ${h.open}`;
  document.getElementById('l-status-text').textContent = statusLabel + ' · ' + (open ? h.open + ' – ' + h.close : h.open + ' da');

  // hero image
  const img = document.getElementById('l-hero-img');
  img.src = d.hero_image;
  img.onerror = function() { this.src = 'https://picsum.photos/seed/restone-hero/400/530'; this.onerror=null; };

  // badge
  document.getElementById('l-badge').innerHTML =
    `<span>${esc(lang(d.badge.line1))}</span><span class="bb">${esc(lang(d.badge.line2))}</span><span>${esc(lang(d.badge.line3))}</span>`;

  // sticker
  document.getElementById('l-sticker').textContent = lang(d.hero_caption);

  // stats
  document.getElementById('l-stats').innerHTML = d.stats.map(s => `
    <div class="stat-cell">
      <div class="stat-icon">${icon(s.icon)}</div>
      ${s.stars ? '<div class="stat-stars">★★★★★</div>' : ''}
      ${s.value ? `<div class="stat-value">${esc(s.value)}</div>` : ''}
      <div class="stat-label">${esc(lang(s.label))}</div>
    </div>`).join('');

  // contacts
  document.getElementById('l-contacts').innerHTML = `
    <a class="contact-card" href="${esc(c.instagram_url)}" target="_blank" rel="noopener">
      <div class="cc-icon">${icon('instagram')}</div>
      <div class="cc-text">
        <div class="cc-label">Instagram</div>
        <div class="cc-value">${esc(lang(c.instagram_label))}</div>
      </div>
      <div class="cc-arrow">›</div>
    </a>
    <a class="contact-card" href="tel:${esc(c.phone)}">
      <div class="cc-icon">${icon('phone')}</div>
      <div class="cc-text">
        <div class="cc-label">${esc(lang(c.phone_label))}</div>
        <div class="cc-value">${esc(c.phone_display)}</div>
      </div>
      <div class="cc-arrow">›</div>
    </a>
    <div class="contact-card">
      <div class="cc-icon">${icon('mappin')}</div>
      <div class="cc-text">
        <div class="cc-label">${currentLang === 'ru' ? 'Адрес' : currentLang === 'uz_cyr' ? 'Манзил' : 'Manzil'}</div>
        <div class="cc-value">${esc(lang(c.address))}</div>
      </div>
    </div>`;

  // booking
  const bookTel = 'tel:' + c.phone;
  document.getElementById('l-booking').href = bookTel;
  document.getElementById('l-booking-title').textContent = lang(d.booking_cta.title);
  document.getElementById('l-booking-sub').textContent = lang(d.booking_cta.subtitle);

  // gallery title
  const gt = lang(d.gallery_title);
  const [gt1, ...gt2] = gt.split(' ');
  document.getElementById('l-gallery-title').innerHTML = `${esc(gt1)} <em>${esc(gt2.join(' '))}</em>`;

  // gallery images
  document.getElementById('l-gallery').innerHTML = d.gallery.map((src, i) => `
    <div class="gallery-item">
      <img src="${esc(src)}" alt="" loading="lazy"
           onerror="this.src='https://picsum.photos/seed/restone-g${i+1}/300/300';this.onerror=null">
    </div>`).join('');

  // features bottom
  document.getElementById('l-feats-bottom').innerHTML = d.features_bottom.map(f => `

    <a class="footer-social" href="${esc(c.instagram_url)}" target="_blank" rel="noopener">${icon('instagram')}</a>

    <a class="footer-social" href="tel:${esc(c.phone)}">${icon('phone')}</a>`;
  document.getElementById('l-footer-copy').textContent = '© ' + new Date().getFullYear() + ' ' + d.name;

// ─── ESCAPE ──────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── MENU ────────────────────────────────────────────────────────────────────
let allCategories = [];
let activeCat = 'all';

function renderCards(catName) {
  let items = [];
  if (catName === 'all') {
    allCategories.forEach(c => { if (c.items) items = items.concat(c.items.filter(i => !i.hidden && i.available !== false)); });
  } else {
    const cat = allCategories.find(c => c.name === catName);
    if (cat && cat.items) items = cat.items.filter(i => !i.hidden && i.available !== false);
  }
  if (!items.length) return '<div class="menu-loading" style="grid-column:1/-1">—</div>';
  return items.map(item => {
    const minPrice = item.variants && item.variants.length
      ? Math.min(...item.variants.map(v => v.price))
      : (item.price ? Number(item.price) : null);
    const priceStr = minPrice !== null
      ? (item.variants && item.variants.length ? lang(I18N.price_from) : '') + minPrice.toLocaleString('ru-RU') + lang(I18N.price_unit)
      : '';
    const badge = item.badges && item.badges[0] ? `<span class="cbadge">${esc(item.badges[0])}</span>` : '';
    const imgSrc = item.image ? (item.image.startsWith('http') ? item.image : ('rest-one/' + item.image)) : '';
    const imgEl = imgSrc
      ? `<img src="${esc(imgSrc)}" alt="${esc(item.title)}" loading="lazy">`
      : `<span class="cimg-ph">🍽</span>`;
    return `<div class="card">
      <div class="cimg">${imgEl}</div>
      <div class="cb">
        <p class="cn">${esc(item.title)}</p>
        <p class="cd">${esc(item.description || '')}</p>
        <div class="cf"><span class="cp">${esc(priceStr)}</span>${badge}</div>
      </div>
    </div>`;
  }).join('');
}

function renderCatTabs() {
  const tabs = [`<button class="cat on" onclick="fc(this,'all')">${esc(lang(I18N.all_cats))}</button>`];
  allCategories.forEach(c => {
    tabs.push(`<button class="cat" onclick="fc(this,this.dataset.cat)" data-cat="${esc(c.name)}">${esc(c.name)}</button>`);
  });
  return tabs.join('');
}

function fc(btn, cat) {
  document.querySelectorAll('.cat').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  activeCat = cat;
  document.getElementById('grid').innerHTML = renderCards(cat);
}

function buildMenu(data) {
  allCategories = (data.categories || []).filter(c => !c.hidden);
  document.getElementById('cats').innerHTML = renderCatTabs();
  document.getElementById('grid').innerHTML = renderCards('all');
}

// ─── INIT ────────────────────────────────────────────────────────────────────
initLangBar();
renderLanding();

document.getElementById('menuLoading').textContent = lang(I18N.loading);

fetch(MENU_URL)
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(buildMenu)
  .catch(() => {
    document.getElementById('menuLoading').innerHTML =
      '<div class="menu-error">' + esc(lang(I18N.load_fail)) + '</div>';
  });
</script>
