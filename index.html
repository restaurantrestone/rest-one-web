<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7C5CFF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'%3E%3Crect width='400' height='400' rx='92' fill='%23171226'/%3E%3Cg fill='none' stroke='%23ffffff' stroke-width='31.5' stroke-linecap='round'%3E%3Cline x1='200' y1='161' x2='290.63' y2='91.99'/%3E%3Cline x1='237.09' y1='187.95' x2='330.73' y2='252.82'/%3E%3Cline x1='222.92' y1='231.55' x2='190.16' y2='340.66'/%3E%3Cline x1='177.08' y1='231.55' x2='63.19' y2='234.11'/%3E%3Cline x1='162.91' y1='187.95' x2='125.28' y2='80.43'/%3E%3C/g%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-title" content="Menu">
<title>Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{
  /* purple-biased neutrals + one vivid accent */
  --cream:#FBFAFD;        /* page surface        */
  --dark:#171226;         /* ink                 */
  --gold:#7C5CFF;         /* ACCENT (violet)     */
  --accent-deep:#4A2FC7;
  --accent-soft:#F1ECFF;
  --green:#1B1430;        /* deep surface        */
  --muted:#6B6480;
  --faint:#9A93AC;
  --card:#FFFFFF;
  --border:#EAE6F5;
  /* один гротеск на всё — иерархия строится весом и трекингом, не сменой шрифта */
  --serif:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sans:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html{scroll-behavior:smooth}
body{background:#E9E4F5;font-family:var(--sans);color:var(--dark)}

/* ─── STICKY LANG BAR ─── */
.lang-bar{
  position:sticky;top:0;z-index:200;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:8px 16px;
  background:rgba(251,250,253,0.96);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(124,92,255,0.18);
}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;min-width:0}
.brand-logo{
  width:30px;height:30px;flex:0 0 auto;background:var(--gold);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:15px;font-weight:700;color:#fff;
}
.brand-name{
  font-family:var(--serif);font-size:17px;font-weight:700;color:var(--dark);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lang-btns{display:flex;gap:5px;flex:0 0 auto}
.lang-btn{
  padding:5px 11px;border-radius:20px;
  border:1.5px solid var(--border);
  background:transparent;color:var(--muted);
  font-family:var(--sans);font-size:11px;font-weight:600;
  cursor:pointer;letter-spacing:.3px;transition:all .15s;
}
.lang-btn.active{background:var(--gold);border-color:var(--gold);color:#fff}
/* Besh credit (bottom ad) */
.besh-credit{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:15px 20px 22px;background:var(--cream);
  border-top:1px solid var(--border);
  text-decoration:none;color:var(--muted);font-size:12px;letter-spacing:.2px;
}
.besh-credit b{color:var(--gold);font-weight:700}
.besh-credit .bc-mark{width:15px;height:15px;flex:0 0 auto;color:var(--gold)}
.besh-credit:active{opacity:.6}

/* ─── PAGE WRAPPER ─── */
.page{max-width:520px;margin:0 auto;background:var(--cream);min-height:100vh;box-shadow:0 0 60px rgba(0,0,0,.08)}

/* ─── HERO ─── */
.hero-section{padding:32px 20px 0;display:none}   /* menu-first: big hero hidden, name lives in header */
.hero-inner{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.hero-inner.hero-noimg{grid-template-columns:1fr}   /* hero photo disabled/empty → single column */
.hero-eyebrow{
  font-size:10px;letter-spacing:3px;text-transform:uppercase;
  color:var(--gold);font-weight:700;display:block;margin-bottom:10px;
}
.hero-title{
  font-family:var(--serif);font-size:36px;font-weight:700;
  color:var(--dark);line-height:1.05;margin-bottom:12px;
}
.hero-tagline{
  font-family:var(--serif);font-size:19px;color:var(--gold);
  margin-bottom:18px;line-height:1.3;
}
.hero-features{display:flex;flex-direction:column;gap:11px;margin-bottom:18px}
.hf{display:flex;align-items:center;gap:9px}
.hf-ico{
  width:30px;height:30px;background:rgba(124,92,255,.12);border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.hf-ico svg{width:15px;height:15px;stroke:var(--gold);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hf-title{font-size:12px;font-weight:600;color:var(--dark);line-height:1.2}
.hf-sub{font-size:10px;color:var(--muted);line-height:1.3;margin-top:1px}
.status-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 13px;border-radius:30px;
  background:rgba(124,92,255,.1);border:1px solid rgba(124,92,255,.3);
  font-size:11px;color:var(--dark);font-weight:500;
}
.s-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.s-dot.open{background:#4CAF50}
.s-dot.closed{background:var(--muted)}

/* hero right */
.hero-right{position:relative}
.hero-img-wrap{
  border-radius:20px;overflow:hidden;aspect-ratio:3/4;
  background:#E4DEF5;position:relative;
}
.hero-img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.hero-badge{
  position:absolute;top:10px;right:-8px;
  width:76px;height:76px;background:var(--gold);border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:5px;line-height:1.25;
  box-shadow:0 4px 14px rgba(124,92,255,.45);
}
.hero-badge span{font-size:8.5px;font-weight:700;color:#1A1A1A;text-transform:uppercase;letter-spacing:.2px}
.hero-badge .bb{font-size:9.5px;font-weight:900}
.hero-sticker{
  position:absolute;bottom:10px;left:-8px;right:-8px;
  background:var(--dark);color:var(--gold);
  padding:7px 10px;border-radius:10px;
  font-family:var(--serif);font-size:13px;text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}

/* ─── STATS BAR ─── */
.stats-bar{
  background:var(--green);margin:28px 0 0;
  padding:28px 20px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
}
.stat-cell{text-align:center;color:#fff}
.stat-icon{
  width:30px;height:30px;margin:0 auto 7px;
  background:rgba(255,255,255,.1);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.stat-icon svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.stat-value{
  font-family:var(--serif);font-size:22px;font-weight:700;
  color:var(--gold);line-height:1;margin-bottom:4px;
}
.stat-stars{color:var(--gold);font-size:9px;margin-bottom:3px;letter-spacing:1px}
.stat-label{font-size:10px;color:rgba(255,255,255,.72);line-height:1.45;white-space:pre-line}

/* ─── CONTACTS ─── */
.contacts-section{padding:24px 20px;display:flex;flex-direction:column;gap:10px}
.contact-card{
  display:flex;align-items:center;gap:13px;
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:13px 15px;
  text-decoration:none;color:var(--dark);transition:opacity .15s;
}
.contact-card:hover{opacity:.8}
.cc-icon{
  width:40px;height:40px;background:rgba(124,92,255,.12);border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.cc-icon svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cc-text{flex:1;min-width:0}
.cc-label{font-size:11px;color:var(--muted);margin-bottom:2px}
.cc-value{font-size:13px;font-weight:600;color:var(--dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-arrow{color:var(--muted);font-size:15px;flex-shrink:0}

/* ─── BOOKING CTA ─── */
.booking-section{padding:0 20px 24px}
.booking-btn{
  display:block;width:100%;background:var(--gold);color:#fff;
  border:none;border-radius:22px;padding:18px 20px;
  text-align:center;text-decoration:none;cursor:pointer;transition:opacity .15s;
}
.booking-btn:hover{opacity:.88}
.booking-title{
  font-family:var(--serif);font-size:19px;font-weight:700;
  display:block;margin-bottom:4px;
}
.booking-sub{font-size:12px;color:rgba(255,255,255,.82);display:block}

/* ─── GALLERY ─── */
.gallery-section{padding:0 20px 24px}
.section-title{
  font-family:var(--serif);font-size:21px;font-weight:700;
  color:var(--dark);margin-bottom:14px;
}
.section-title em{font-style:italic;color:var(--gold)}
.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gallery-item{
  border-radius:14px;overflow:hidden;aspect-ratio:1;background:#E4DEF5;
}
.gallery-item img{width:100%;height:100%;object-fit:cover;display:block}

/* ─── FEATURES BOTTOM ─── */
.features-bottom{padding:0 20px 28px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.feat-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:15px;
}
.feat-icon{
  width:34px;height:34px;background:rgba(124,92,255,.12);border-radius:50%;
  display:flex;align-items:center;justify-content:center;margin-bottom:9px;
}
.feat-icon svg{width:17px;height:17px;stroke:var(--gold);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.feat-title{font-size:12px;font-weight:600;color:var(--dark);line-height:1.3;margin-bottom:3px}
.feat-sub{font-size:11px;color:var(--muted)}

/* ─── MENU CTA DIVIDER ─── */
.menu-cta-section{padding:0 20px 28px;text-align:center;display:none}   /* menu shown by default, no toggle */
.divider{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.divider-text{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;white-space:nowrap}
.show-menu-btn{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--dark);color:#fff;
  border:none;border-radius:30px;padding:15px 36px;
  font-family:var(--serif);font-size:16px;font-weight:700;
  cursor:pointer;text-decoration:none;
  transition:background .2s, transform .15s, box-shadow .2s;
  box-shadow:0 4px 18px rgba(26,26,26,.18);
}
.show-menu-btn:hover{background:var(--gold);box-shadow:0 6px 24px rgba(124,92,255,.35);transform:translateY(-1px)}
.show-menu-btn .smb-arrow{font-size:18px;transition:transform .25s}
.show-menu-btn.open .smb-arrow{transform:rotate(180deg)}

/* ═══ MENU ═══════════════════════════════════════════════════════════════ */
#menu{background:var(--cream);padding:6px 18px 30px;display:block}
#menu.visible{display:block}

/* — head: title + search — */
.menu-head{padding:30px 0 20px}
.menu-eyebrow{
  font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:2.6px;
  text-transform:uppercase;color:var(--gold);display:block;margin-bottom:9px;
}
.menu-section-title{
  font-family:var(--sans);font-size:34px;font-weight:600;line-height:1.05;
  color:var(--dark);letter-spacing:-1.1px;
}
.menu-section-title em{font-style:normal;color:inherit}
.searchbox{position:relative;margin-top:16px}
.searchbox svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;pointer-events:none;
}
.searchbox input{
  width:100%;height:46px;border-radius:14px;
  border:1.5px solid var(--border);background:var(--card);
  padding:0 40px 0 40px;font-family:var(--sans);font-size:14px;color:var(--dark);
  outline:none;transition:border-color .18s,box-shadow .18s;
}
.searchbox input::placeholder{color:var(--faint)}
.searchbox input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(124,92,255,.14)}
.search-clear{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:30px;height:30px;border:none;background:transparent;cursor:pointer;
  color:var(--faint);font-size:19px;line-height:1;border-radius:50%;display:none;
}
.searchbox.has-q .search-clear{display:block}

/* — category tiles (entry screen, like the tablet menu) — */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ctile{
  position:relative;display:block;width:100%;padding:0;cursor:pointer;
  border:1px solid var(--border);border-radius:20px;overflow:hidden;
  background:var(--card);aspect-ratio:1/1;text-align:left;
  font-family:var(--sans);transition:transform .18s,box-shadow .18s,border-color .18s;
}
.ctile:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(23,18,38,.10);border-color:rgba(124,92,255,.4)}
.ctile:active{transform:scale(.985)}
.ctile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ctile .ct-veil{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(23,18,38,0) 34%,rgba(23,18,38,.82) 100%);
}
.ctile.noimg{background:var(--accent-soft)}
.ctile.noimg img,.ctile.noimg .ct-veil{display:none}
.ctile.noimg .ct-name,.ctile.noimg .ct-count{color:var(--dark)}
.ctile.noimg .ct-count{color:var(--muted)}
.ctile.noimg::after{
  content:'';position:absolute;top:16px;left:16px;width:26px;height:26px;
  border-radius:50%;border:2px solid rgba(124,92,255,.45);
}
.ct-body{position:absolute;left:0;right:0;bottom:0;padding:14px 14px 13px}
.ct-name{
  display:block;font-family:var(--sans);font-size:17px;font-weight:600;
  color:#fff;line-height:1.15;margin-bottom:3px;letter-spacing:-.3px;
}
.ct-count{display:block;font-size:11px;font-weight:400;color:rgba(255,255,255,.66);letter-spacing:.2px}

/* — sticky bar inside a category: back + category switcher — */
.dishbar{
  position:sticky;top:46px;z-index:150;
  display:flex;align-items:center;gap:9px;
  padding:11px 0 10px;margin:0 -18px 4px;padding-left:18px;padding-right:18px;
  background:rgba(251,250,253,.97);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
}
.backbtn{
  flex:0 0 auto;width:38px;height:38px;border-radius:12px;cursor:pointer;
  border:1.5px solid var(--border);background:var(--card);color:var(--dark);
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.backbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.backbtn:hover{border-color:var(--gold);color:var(--gold)}
.cats{
  display:flex;gap:7px;overflow-x:auto;flex:1;min-width:0;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;
}
.cats::-webkit-scrollbar{display:none}
.cat{
  padding:0 15px;height:38px;border-radius:12px;font-size:13px;font-weight:600;
  cursor:pointer;white-space:nowrap;border:1.5px solid var(--border);
  color:var(--muted);background:var(--card);
  font-family:var(--sans);flex-shrink:0;transition:all .15s;
}
.cat:hover{border-color:rgba(124,92,255,.45);color:var(--dark)}
.cat.on{background:var(--gold);color:#fff;border-color:var(--gold)}

/* — tag filters — */
.tagchips{display:flex;gap:7px;overflow-x:auto;padding:14px 0 2px;margin-bottom:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tagchips::-webkit-scrollbar{display:none}
.tagchip{
  padding:0 13px;height:34px;border-radius:11px;font-size:12px;font-weight:600;
  cursor:pointer;white-space:nowrap;border:1.5px solid var(--border);
  color:var(--muted);background:var(--card);
  font-family:var(--sans);flex-shrink:0;transition:all .15s;
}
.tagchip.on{background:var(--accent-soft);color:var(--accent-deep);border-color:rgba(124,92,255,.55)}

/* — dish cards — */
.cat-heading{padding:20px 0 14px}
.cat-heading h3{font-family:var(--sans);font-size:26px;font-weight:600;color:var(--dark);letter-spacing:-.7px}
.cat-heading span{font-size:12px;color:var(--faint);display:block;margin-top:3px;letter-spacing:.2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  overflow:hidden;cursor:pointer;text-align:left;padding:0;width:100%;
  font-family:var(--sans);display:flex;flex-direction:column;
  transition:transform .18s,box-shadow .18s,border-color .18s;
}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(23,18,38,.09);border-color:rgba(124,92,255,.35)}
.card:active{transform:scale(.985)}
/* Фото блюда — ЦЕЛИКОМ, без обрезки (contain). Поля вокруг снимка заливаются
   чёрным или белым — что ближе к краям самого фото (см. fitBg): на тёмном
   снимке кадр продолжается в чёрное, на светлом — в белое, границы не видно. */
/* Главное в карточке — ФОТО: кадр вытянут по вертикали (4:5) и занимает ~три
   четверти карточки, а подпись сжата до названия и цены. Описание не дублируем
   в сетке — оно показывается, когда гость открывает блюдо. */
.cimg{width:100%;aspect-ratio:4/5;height:auto;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--accent-soft);position:relative}
.cimg img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain}
.cimg-ph{font-size:34px;opacity:.35}
.cimg.noimg img{display:none}
.cimg.noimg::after{content:'';width:30px;height:30px;border-radius:50%;border:2px solid rgba(124,92,255,.4)}
.cb{padding:9px 11px 11px;display:flex;flex-direction:column;gap:3px;flex:1}
.cn{font-size:12.5px;font-weight:500;color:var(--dark);line-height:1.3;letter-spacing:-.1px;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cf{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:3px}
.cp{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--dark);font-variant-numeric:tabular-nums;white-space:nowrap}
.cbadge{font-size:9px;color:var(--accent-deep);background:var(--accent-soft);padding:2px 6px;border-radius:7px;font-weight:600;white-space:nowrap}
.menu-loading{padding:40px;text-align:center;color:var(--muted);font-size:14px}
.menu-error{padding:32px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}

/* — skeletons while the menu loads — */
.skel{border-radius:20px;aspect-ratio:1/1;background:linear-gradient(90deg,#F2EFFA 25%,#E9E4F6 37%,#F2EFFA 63%);background-size:400% 100%;animation:sk 1.4s ease infinite}
@keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}

/* — dish sheet (tap a dish for the full description) — */
.sheet-back{
  position:fixed;inset:0;z-index:400;background:rgba(23,18,38,.52);
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.sheet-back.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:401;
  max-width:520px;margin:0 auto;background:var(--card);
  border-radius:26px 26px 0 0;max-height:90vh;overflow-y:auto;
  transform:translateY(101%);transition:transform .3s cubic-bezier(.22,.8,.2,1);
  box-shadow:0 -12px 40px rgba(23,18,38,.24);
}
.sheet.on{transform:none}
.sheet-grip{width:40px;height:4px;border-radius:4px;background:var(--border);margin:10px auto 0}
.sheet-imgwrap{
  position:relative;width:100%;aspect-ratio:1/1;max-height:62vh;overflow:hidden;
  background:var(--accent-soft);display:flex;align-items:center;justify-content:center;
}
.sheet-img{position:relative;z-index:1;max-width:100%;max-height:100%;object-fit:contain;display:block}
.sheet-body{padding:13px 18px 20px}
.sheet-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.sheet-title{font-family:var(--sans);font-size:19px;font-weight:600;color:var(--dark);line-height:1.2;margin-bottom:6px;letter-spacing:-.3px}
.sheet-desc{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:10px}
.sheet-price{font-size:19px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.sheet-vars{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.sheet-var{display:flex;justify-content:space-between;gap:12px;padding:11px 13px;border:1px solid var(--border);border-radius:12px;font-size:13px}
.sheet-var b{font-weight:700;font-variant-numeric:tabular-nums}
.sheet-close{
  width:100%;margin-top:14px;height:48px;border-radius:14px;cursor:pointer;
  border:none;background:var(--dark);color:#fff;
  font-family:var(--sans);font-size:14px;font-weight:600;
}
@media(prefers-reduced-motion:reduce){
  .skel{animation:none}
  .sheet{transition:none}
  .ctile,.card{transition:none}
}

/* ─── LANDING OFF ───
   Витрина ресторана (герой, цифры, контакты, бронь, «фишки») на опубликованном
   меню не нужна — страница обязана быть только меню. Разметка остаётся в DOM,
   чтобы renderLanding() продолжал работать; наружу не показывается. */
#landing{display:none}

/* ─── FOOTER (минимальный) ─── */
.site-footer{
  background:var(--green);padding:30px 22px 26px;text-align:center;
}
.footer-logo,.footer-tagline{display:none}
.footer-name{

.footer-socials{display:flex;justify-content:center;gap:10px}

// ─── MENU URL ────────────────────────────────────────────────────────────────
const MENU_URL = (function () {
  const tmpl = 'rest-one/menu.json';
  if (!tmpl.startsWith('{{')) return tmpl;
  const r = new URLSearchParams(location.search).get('r');
  return r ? r + '/menu.json' : 'menu.json';
})();
// Images live next to menu.json in the same GitHub Pages folder — derive the prefix
// from MENU_URL instead of hardcoding the restaurant slug.
const IMG_PREFIX = MENU_URL.replace(/menu\.json$/, '');
// The sync uploads every image under the same slug dir as menu.json, so any
// non-absolute path must be resolved against IMG_PREFIX (not the site root).
function imgUrl(p) {
  if (!p) return '';
  p = String(p);
  return /^(https?:|data:)/i.test(p) ? p : IMG_PREFIX + p.replace(/^\/+/, '');
}

// ─── LANGUAGE ────────────────────────────────────────────────────────────────
let currentLang = localStorage.getItem('emenu_lang') || 'uz_lat';

function lang(field) {
  return (field && (field[currentLang] || field.uz_lat)) || '';
}

function setLang(l) {
  currentLang = l;
  localStorage.setItem('emenu_lang', l);
  renderLanding();
  if (menuRaw) buildMenu(menuRaw);   // dishes follow the language too
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === l);
  });
}

function initLangBar() {
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === currentLang);
  });
}

// ─── OPEN/CLOSED ─────────────────────────────────────────────────────────────
function isOpen(hours) {
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  const [oH, oM] = hours.open.split(':').map(Number);
  const [cH, cM] = hours.close.split(':').map(Number);
  return mins >= oH * 60 + oM && mins < cH * 60 + cM;
}

// ─── ESCAPE ──────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// Block scripting URL schemes (javascript:/data:/vbscript:) before a value goes
// into an href. Browsers ignore control chars/whitespace inside a scheme, so
// normalize those out before testing. Safe URLs are HTML-escaped as usual.
function safeUrl(u) {
  const probe = String(u || '').replace(/[\x00-\x20]+/g, '').toLowerCase();
  if (/^(javascript:|data:|vbscript:)/.test(probe)) return '#';
  return esc(u);
}

// ─── MENU ────────────────────────────────────────────────────────────────────
let allCategories = [];
let activeCat = null;   // null = входной экран с плитками категорий
let searchQ = '';
let menuRaw = null;   // menu as fetched; re-localized when the language changes

// Dish/category text may be multilingual {ru, uz_lat, uz_cyr} since Phase 8;
// plain strings (old menus) pass through untouched.
function mlText(v) {
  if (v == null) return '';
  if (typeof v !== 'object' || Array.isArray(v)) return String(v);
  return v[currentLang] || v.ru || v.uz_lat || v.uz_cyr || '';
}
function localizeCats(cats) {
  return (cats || []).map(c => Object.assign({}, c, {
    name: mlText(c.name),
    items: (c.items || []).map(it => Object.assign({}, it, {
      title: mlText(it.title),
      description: mlText(it.description),
    })),
  }));
}

// Фильтры по меткам (веган/острое/…): И-логика, как на планшетах
let activeTags = new Set();
function itemMatchesTags(item) {
  if (!activeTags.size) return true;
  const b = Array.isArray(item.badges) ? item.badges : [];
  for (const t of activeTags) if (!b.includes(t)) return false;
  return true;
}

function visItems(c) { return ((c && c.items) || []).filter(i => !i.hidden && i.available !== false); }
function catByName(n) { return allCategories.find(c => c.name === n) || null; }

// «3 блюда» / «5 блюд» — русский требует склонения, узбекский нет
function itemsWord(n) {
  if (currentLang === 'ru') {
    const a = n % 100, b = n % 10;
    if (a >= 11 && a <= 14) return 'блюд';
    if (b === 1) return 'блюдо';
    if (b >= 2 && b <= 4) return 'блюда';
    return 'блюд';
  }
  return currentLang === 'uz_cyr' ? 'таом' : 'taom';
}

// Плитка категории: своя картинка → фото первого блюда → пустая плитка со знаком.
// Возвращает [основная, запасная] — если своя картинка не загрузилась (её могли
// не выгрузить на сайт), плитка молча подставляет фото блюда, а не пустеет.
function catImage(c) {
  const dish = visItems(c).find(i => i.image);
  const dishSrc = dish ? imgUrl(dish.image) : '';
  const own = c.categoryImage ? imgUrl(c.categoryImage) : (c.image ? imgUrl(c.image) : '');
  if (own) return [own, own === dishSrc ? '' : dishSrc];
  return [dishSrc, ''];
}

function priceText(item) {
  const min = item.variants && item.variants.length
    ? Math.min(...item.variants.map(v => Number(v.price) || 0))
    : (item.price ? Number(item.price) : null);
  if (min === null) return '';
  return (item.variants && item.variants.length ? lang(I18N.price_from) : '') +
    min.toLocaleString('ru-RU') + lang(I18N.price_unit);
}

function renderTagChips() {
  const host = document.getElementById('tagchips');
  if (!host) return;
  const present = new Set();
  visItems(catByName(activeCat)).forEach(i =>
    (Array.isArray(i.badges) ? i.badges : []).forEach(b => present.add(b)));
  const keys = BADGE_KEYS.filter(k => present.has(k));
  activeTags.forEach(t => { if (!keys.includes(t)) activeTags.delete(t); });
  host.style.display = keys.length ? '' : 'none';
  host.innerHTML = keys.map(k =>
    `<button class="tagchip${activeTags.has(k) ? ' on' : ''}" type="button" data-tag="${esc(k)}">${esc(badgeLabel(k))}</button>`
  ).join('');
  host.querySelectorAll('.tagchip').forEach(btn => btn.addEventListener('click', () => {
    const t = btn.dataset.tag;
    if (activeTags.has(t)) activeTags.delete(t); else activeTags.add(t);
    btn.classList.toggle('on');
    renderGrid();
  }));
}

// Подбор фона под фото: смотрим на ЯРКОСТЬ КРАЁВ снимка (именно они граничат с
// полем) и заливаем поле чёрным или белым — кадр как будто продолжается.
// Кросс-доменное фото прочитать нельзя (canvas «портится») — тогда молча
// оставляем фон по умолчанию.
function fitBg(img) {
  try {
    const S = 20;
    const c = document.createElement('canvas');
    c.width = S; c.height = S;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, S, S);
    const d = ctx.getImageData(0, 0, S, S).data;
    let sum = 0, n = 0;
    for (let y = 0; y < S; y++) {
      for (let x = 0; x < S; x++) {
        if (x > 1 && x < S - 2 && y > 1 && y < S - 2) continue;   // только рамка по краю
        const i = (y * S + x) * 4;
        sum += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
        n++;
      }
    }
    const host = img.parentNode;
    if (host && n) host.style.background = (sum / n) > 140 ? '#ffffff' : '#000000';
  } catch (_e) { /* фото с другого домена — оставляем фон как есть */ }
}

function cardHTML(item, catName) {
  const badge = item.badges && item.badges[0]
    ? `<span class="cbadge">${esc(badgeLabel(item.badges[0]))}</span>` : '';
  const src = imgUrl(item.image);
  const img = src
    ? `<img src="${esc(src)}" alt="${esc(item.title)}" loading="lazy" onload="fitBg(this)" onerror="this.onerror=null;this.parentNode.classList.add('noimg')">`
    : '';
  return `<button class="card" type="button" data-cat="${esc(catName)}" data-id="${esc(item.id)}">
    <span class="cimg${src ? '' : ' noimg'}">${img}</span>
    <span class="cb">
      <span class="cn">${esc(item.title)}</span>
      <span class="cf"><span class="cp">${esc(priceText(item))}</span>${badge}</span>
    </span>
  </button>`;
}

function bindCards(host) {
  host.querySelectorAll('.card').forEach(b =>
    b.addEventListener('click', () => openDish(b.dataset.cat, b.dataset.id)));
}

// ─── ЭКРАН 1: плитки категорий ───────────────────────────────────────────────
function renderCatGrid() {
  const host = document.getElementById('catGrid');
  if (!host) return;
  host.innerHTML = allCategories.map(c => {
    const n = visItems(c).length;
    const pair = catImage(c);
    const src = pair[0], fb = pair[1];
    return `<button class="ctile${src ? '' : ' noimg'}" type="button" data-cat="${esc(c.name)}">
      ${src ? `<img src="${esc(src)}" alt="" loading="lazy"${fb ? ` data-fb="${esc(fb)}"` : ''} onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.removeAttribute('data-fb');}else{this.onerror=null;this.parentNode.classList.add('noimg');}">` : ''}
      <span class="ct-veil"></span>
      <span class="ct-body">
        <span class="ct-name">${esc(c.name)}</span>
        <span class="ct-count">${n} ${esc(itemsWord(n))}</span>
      </span>
    </button>`;
  }).join('');
  host.querySelectorAll('.ctile').forEach(b =>
    b.addEventListener('click', () => openCat(b.dataset.cat)));
}

// ─── ЭКРАН 2: блюда категории ────────────────────────────────────────────────
// Чипы позволяют перейти в другую категорию, не возвращаясь к плиткам.
function renderChips() {
  const host = document.getElementById('cats');
  if (!host) return;
  host.innerHTML = allCategories.map(c =>
    `<button class="cat${c.name === activeCat ? ' on' : ''}" type="button" data-cat="${esc(c.name)}">${esc(c.name)}</button>`
  ).join('');
  host.querySelectorAll('.cat').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.cat !== activeCat) openCat(b.dataset.cat);
  }));
  const on = host.querySelector('.cat.on');
  if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'center' });
}

function renderGrid() {
  const grid = document.getElementById('grid');
  if (!grid) return;
  let items = visItems(catByName(activeCat));
  const hadAny = items.length > 0;
  items = items.filter(itemMatchesTags);
  const t = document.getElementById('catTitle');
  const c = document.getElementById('catCount');
  if (t) t.textContent = activeCat || '';
  if (c) c.textContent = items.length + ' ' + itemsWord(items.length);
  grid.innerHTML = items.length
    ? items.map(i => cardHTML(i, activeCat)).join('')
    : `<div class="menu-loading" style="grid-column:1/-1">${esc(hadAny && activeTags.size ? lang(I18N.filter_empty) : '—')}</div>`;
  bindCards(grid);
}

// ─── НАВИГАЦИЯ ───────────────────────────────────────────────────────────────
function showView(dishes) {
  const vc = document.getElementById('view-cats');
  const vd = document.getElementById('view-dishes');
  if (vc) vc.hidden = dishes;
  if (vd) vd.hidden = !dishes;
  // Подвал (название + телефон + адрес) остаётся на обоих экранах — это
  // единственное место с контактами после того, как витрину убрали.
}

function openCat(name, push) {
  if (!catByName(name)) return;
  activeCat = name;
  activeTags.clear();
  showView(true);
  renderChips(); renderTagChips(); renderGrid();
  window.scrollTo(0, 0);
  if (push !== false) history.pushState({ cat: name }, '', '#c=' + encodeURIComponent(name));
}

function goHome(push) {
  activeCat = null;
  activeTags.clear();
  showView(false);
  renderCatGrid();
  window.scrollTo(0, 0);
  if (push !== false) history.pushState({}, '', location.pathname + location.search);
}

// Кнопка «назад» в браузере/телефоне работает как выход из категории
window.addEventListener('popstate', () => {
  const m = location.hash.match(/^#c=(.*)$/);
  if (m) {
    const n = decodeURIComponent(m[1]);
    if (catByName(n)) { openCat(n, false); return; }
  }
  goHome(false);
});

// ─── ПОИСК ───────────────────────────────────────────────────────────────────
function runSearch(q) {
  searchQ = String(q || '').trim().toLowerCase();
  const box = document.getElementById('searchBox');
  const grid = document.getElementById('searchGrid');
  const tiles = document.getElementById('catGrid');
  if (!box || !grid || !tiles) return;
  box.classList.toggle('has-q', !!searchQ);
  if (searchQ.length < 2) { grid.hidden = true; tiles.hidden = false; return; }
  const hits = [];
  allCategories.forEach(c => visItems(c).forEach(i => {
    const hay = ((i.title || '') + ' ' + (i.description || '')).toLowerCase();
    if (hay.indexOf(searchQ) !== -1) hits.push([i, c.name]);
  }));
  tiles.hidden = true;
  grid.hidden = false;
  grid.innerHTML = hits.length
    ? hits.slice(0, 60).map(h => cardHTML(h[0], h[1])).join('')
    : `<div class="menu-loading" style="grid-column:1/-1">${esc(lang(I18N.nothing))}</div>`;
  bindCards(grid);
}

// ─── КАРТОЧКА БЛЮДА (полное описание) ────────────────────────────────────────
function openDish(catName, id) {
  const cat = catByName(catName);
  const item = cat ? visItems(cat).find(i => String(i.id) === String(id)) : null;
  if (!item) return;
  const sheet = document.getElementById('sheet');
  const back = document.getElementById('sheetBack');
  if (!sheet || !back) return;
  const src = imgUrl(item.image);
  const badges = (Array.isArray(item.badges) ? item.badges : [])
    .map(b => `<span class="cbadge">${esc(badgeLabel(b))}</span>`).join('');
  const vars = (item.variants && item.variants.length)
    ? `<div class="sheet-vars">${item.variants.map(v =>
        `<div class="sheet-var"><span>${esc(mlText(v.label ?? v.name) || '')}</span><b>${(Number(v.price) || 0).toLocaleString('ru-RU')}${esc(lang(I18N.price_unit))}</b></div>`
      ).join('')}</div>`
    : '';
  sheet.innerHTML =
    `<div class="sheet-grip"></div>
     ${src ? `<div class="sheet-imgwrap">
       <img class="sheet-img" src="${esc(src)}" alt="${esc(item.title)}" onload="fitBg(this)" onerror="this.parentNode.style.display='none'">
     </div>` : ''}
     <div class="sheet-body">
       ${badges ? `<div class="sheet-badges">${badges}</div>` : ''}
       <div class="sheet-title">${esc(item.title)}</div>
       ${item.description ? `<div class="sheet-desc">${esc(item.description)}</div>` : ''}
       <div class="sheet-price">${esc(priceText(item))}</div>
       ${vars}
       <button class="sheet-close" type="button">${esc(lang(I18N.close))}</button>
     </div>`;
  sheet.classList.add('on');
  back.classList.add('on');
  document.body.style.overflow = 'hidden';
  const cb = sheet.querySelector('.sheet-close');
  if (cb) cb.addEventListener('click', closeSheet);
}

function closeSheet() {
  const sheet = document.getElementById('sheet');
  const back = document.getElementById('sheetBack');
  if (sheet) sheet.classList.remove('on');
  if (back) back.classList.remove('on');
  document.body.style.overflow = '';
}

// ─── СБОРКА МЕНЮ ─────────────────────────────────────────────────────────────
function buildMenu(data) {
  menuRaw = data;
  allCategories = localizeCats((data.categories || []).filter(c => !c.hidden))
    .filter(c => visItems(c).length > 0);

  const total = allCategories.reduce((s, c) => s + visItems(c).length, 0);
  const eb = document.getElementById('l-menu-eyebrow');
  if (eb) eb.textContent = lang(I18N.cats_sub) + ' · ' + total + ' ' + itemsWord(total);
  const si = document.getElementById('searchInput');
  if (si) si.placeholder = lang(I18N.search_ph);
  const ml = document.getElementById('menuLoading');
  if (ml) ml.hidden = true;

  if (activeCat && catByName(activeCat)) {
    showView(true); renderChips(); renderTagChips(); renderGrid();
  } else {
    activeCat = null;
    showView(false);
    renderCatGrid();
  }
  if (searchQ) runSearch(searchQ);
}

// Кнопка «показать меню» из старого макета больше не нужна (меню видно сразу)
function toggleMenu() {}

// ─── ПРИВЯЗКА УПРАВЛЕНИЯ ─────────────────────────────────────────────────────
(function wireMenuUI() {
  const back = document.getElementById('backBtn');
  if (back) back.addEventListener('click', () => goHome());
  const si = document.getElementById('searchInput');
  if (si) si.addEventListener('input', () => runSearch(si.value));
  const sc = document.getElementById('searchClear');
  if (sc) sc.addEventListener('click', () => { if (si) { si.value = ''; si.focus(); } runSearch(''); });
  const sb = document.getElementById('sheetBack');
  if (sb) sb.addEventListener('click', closeSheet);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
})();


// ─── INIT ────────────────────────────────────────────────────────────────────
initLangBar();
renderLanding(); // render with defaults immediately (no blank page)

document.getElementById('menuLoading').textContent = lang(I18N.loading);

// Cache-bust: GitHub Pages + the browser cache menu.json, so without a unique URL
// the owner's edits (menu items AND the hide_* toggles) wouldn't appear on the
// published site until the cache expired — which read as "the toggles don't work".
fetch(MENU_URL + (MENU_URL.indexOf('?') >= 0 ? '&' : '?') + 'v=' + Date.now(), { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    // merge server-side landing (including hide_* flags) into LANDING_DATA
    if (data.landing && typeof data.landing === 'object') {
      Object.assign(LANDING_DATA, data.landing);
      renderLanding(); // re-render with actual visibility settings
    }
    buildMenu(data);
    // Прямая ссылка на категорию (#c=Салат) — открываем её сразу
    const m = location.hash.match(/^#c=(.*)$/);
    if (m) {
      const n = decodeURIComponent(m[1]);
      if (catByName(n)) openCat(n, false);
    }
  })
  .catch(() => {
    const cg = document.getElementById('catGrid');
    if (cg) cg.innerHTML = '';
    const ml = document.getElementById('menuLoading');
    if (ml) {
      ml.hidden = false;
      ml.innerHTML = '<div class="menu-error">' + esc(lang(I18N.load_fail)) + '</div>';
    }
  });
</script>
</body>
